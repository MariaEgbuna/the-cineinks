backend:
  name: github
  repo: MariaEgbuna/the-cineinks
  branch: master
  base_url: https://cineinks.vercel.app
  auth_endpoint: api/auth

media_folder: "public/images/posts"
public_folder: "/images/posts"

collections:
  - name: "posts"
    label: "Posts"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Series", "Movies", "Hall of Fame", "Extra", "Review", "Recap", "List", "Recommendations", "Spotlight"]
      - label: "Labels"
        name: "labels"
        widget: "list"
      - { label: "Score", name: "score", widget: "number", required: false, value_type: "float" }
      - { label: "Verdict Line", name: "verdict", widget: "string", required: false, hint: "One short line shown on the Rating card. Optional." }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Cover Image", name: "coverImage", widget: "image", required: false }
      - { label: "Genres", name: "genres", widget: "list", required: false, hint: "Shown next to the category in the banner. Optional." }
      - { label: "Year", name: "year", widget: "string", required: false, hint: "For example 2025, or 2018 – 2024 for a series. Optional." }
      - { label: "Length", name: "length", widget: "string", required: false, hint: "For example 2h 14m, or 8 seasons, 64 episodes. Optional." }
      - { label: "Where to Watch", name: "network", widget: "string", required: false, hint: "For example Netflix. Optional." }
      - { label: "Cast", name: "cast", widget: "list", required: false, hint: "Up to 3 names are shown in the banner. Optional." }
      - { label: "Featured", name: "featured", widget: "boolean", required: false, default: false }
      - { label: "Body", name: "body", widget: "markdown" }